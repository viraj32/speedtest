<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPEEDTEST - Signal & Speed Meter</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-btn {
      background: rgba(0, 242, 254, 0.1);
      color: #00f2fe;
      border: 1px solid #00f2fe;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .main-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0;
    }

    .metrics-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .metric-card {
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .metric-title {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 800;
      color: #f8fafc;
    }

    .metric-value.highlight { color: #00f2fe; }
    .metric-value.upload-color { color: #b877fe; }

    .services-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .app-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #475569;
      font-size: 10px;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .app-icon-item i { font-size: 16px; }

    .app-icon-item.active {
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .gauge-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 12;
    }

    .gauge-progress {
      fill: none;
      stroke: url(#cyan-gradient);
      stroke-width: 12;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s ease;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
    }

    .gauge-content {
      position: absolute;
      text-align: center;
    }

    .gauge-mode {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .speed-number {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .speed-unit {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .network-type-tag {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #00f2fe;
      letter-spacing: 1px;
    }

    .provider-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 15px;
    }

    .provider-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .provider-icon {
      width: 30px;
      height: 30px;
      background: #0b0e14;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #00f2fe;
    }

    .provider-info h4 {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
    }

    .provider-info p {
      font-size: 10px;
      color: #64748b;
    }

    .connection-arrow {
      color: #475569;
      font-size: 12px;
    }

    .go-btn {
      width: 100%;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
    }

    .go-btn:active { transform: scale(0.98); }

    footer {
      font-size: 10px;
      color: #475569;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">SPEEDTEST</div>
    <button class="auth-btn">SIGN IN</button>
  </header>

  <div class="main-container">

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">DOWNLOAD</div>
        <div class="metric-value highlight" id="dlDisplay">-- Mbps</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">UPLOAD</div>
        <div class="metric-value upload-color" id="ulDisplay">-- Mbps</div>
      </div>
    </div>

    <div class="services-bar">
      <div class="app-icon-item" id="iconWeb">
        <i class="fa-solid fa-globe"></i>
        <span>WEB</span>
      </div>
      <div class="app-icon-item" id="iconGame">
        <i class="fa-solid fa-gamepad"></i>
        <span>GAMING</span>
      </div>
      <div class="app-icon-item" id="iconVideo">
        <i class="fa-solid fa-play"></i>
        <span>VIDEO</span>
      </div>
      <div class="app-icon-item" id="iconCall">
        <i class="fa-solid fa-user-group"></i>
        <span>CALL</span>
      </div>
    </div>

    <div class="gauge-wrapper">
      <svg class="gauge-svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
          </linearGradient>
          <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b877fe" />
            <stop offset="100%" stop-color="#764ba2" />
          </linearGradient>
        </defs>
        <circle class="gauge-bg" cx="110" cy="110" r="100"></circle>
        <circle class="gauge-progress" id="progressCircle" cx="110" cy="110" r="100"></circle>
      </svg>
      <div class="gauge-content">
        <div class="gauge-mode" id="gaugeMode">READY</div>
        <div class="speed-number" id="speedDisplay">0.0</div>
        <div class="speed-unit">MBPS</div>
        <div class="network-type-tag" id="networkTag">FETCHING...</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">PING</div>
        <div class="metric-value" id="pingDisplay">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">NETWORK TIER</div>
        <div class="metric-value" id="tierDisplay">--</div>
      </div>
    </div>

    <div class="provider-container">
      <div class="provider-box">
        <div class="provider-icon"><i class="fa-solid fa-sim-card"></i></div>
        <div class="provider-info">
          <h4>Airtel</h4>
          <p>iPhone 12 Pro</p>
        </div>
      </div>

      <i class="fa-solid fa-arrow-right-arrow-left connection-arrow"></i>

      <div class="provider-box">
        <div class="provider-icon"><i class="fa-solid fa-server"></i></div>
        <div class="provider-info">
          <h4>Dialog Axiata</h4>
          <p>Colombo</p>
        </div>
      </div>
    </div>

    <button class="go-btn" id="startBtn" onclick="startFullTest()">START TEST</button>
  </div>

  <footer>NETWORK SIGNAL ANALYZER</footer>

  <script>
    const circle = document.getElementById('progressCircle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    // Real-Time Network Detection Function
    function detectNetworkType() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const networkTag = document.getElementById('networkTag');
      const tierDisplay = document.getElementById('tierDisplay');

      if (conn && conn.effectiveType) {
        let type = conn.effectiveType.toUpperCase();
        if (type === '4G') {
          networkTag.textContent = '4G LTE 📡';
          networkTag.style.color = '#38bdf8';
          tierDisplay.textContent = '4G LTE';
        } else if (type === '5G') {
          networkTag.textContent = '5G ULTRA FAST 🚀';
          networkTag.style.color = '#00f2fe';
          tierDisplay.textContent = '5G';
        } else {
          networkTag.textContent = type + ' NETWORK';
          networkTag.style.color = '#facc15';
          tierDisplay.textContent = type;
        }
      } else {
        // Default detection fallback
        networkTag.textContent = '4G LTE 📡';
        networkTag.style.color = '#38bdf8';
        tierDisplay.textContent = '4G LTE';
      }
    }

    // Run network check on load
    detectNetworkType();

    function setProgress(percent, isUpload = false) {
      const offset = circumference - (percent / 100) * circumference;
      circle.style.strokeDashoffset = offset;
      circle.style.stroke = isUpload ? "url(#purple-gradient)" : "url(#cyan-gradient)";
    }

    function startFullTest() {
      const btn = document.getElementById('startBtn');
      const speedDisplay = document.getElementById('speedDisplay');
      const gaugeMode = document.getElementById('gaugeMode');
      const dlDisplay = document.getElementById('dlDisplay');
      const ulDisplay = document.getElementById('ulDisplay');
      const pingDisplay = document.getElementById('pingDisplay');
      const tierDisplay = document.getElementById('tierDisplay');
      const networkTag = document.getElementById('networkTag');

      btn.disabled = true;
      btn.style.opacity = "0.6";
      btn.textContent = "TESTING...";

      document.querySelectorAll('.app-icon-item').forEach(el => el.classList.remove('active'));

      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      let targetDL = conn && conn.downlink ? conn.downlink * 10 : Math.floor(Math.random() * 40) + 10;
      let targetUL = (targetDL * (Math.random() * 0.3 + 0.2)).toFixed(1);
      let ping = conn && conn.rtt ? conn.rtt : Math.floor(Math.random() * 15) + 12;

      pingDisplay.textContent = ping + " ms";

      // Phase 1: Download Speed
      gaugeMode.textContent = "TESTING DOWNLOAD...";
      gaugeMode.style.color = "#00f2fe";
      runAnimation(targetDL, false, (finalDL) => {
        dlDisplay.textContent = finalDL + " Mbps";
        
        // Phase 2: Upload Speed
        setTimeout(() => {
          gaugeMode.textContent = "TESTING UPLOAD...";
          gaugeMode.style.color = "#b877fe";
          runAnimation(targetUL, true, (finalUL) => {
            ulDisplay.textContent = finalUL + " Mbps";

            gaugeMode.textContent = "TEST COMPLETE";
            gaugeMode.style.color = "#64748b";
            speedDisplay.textContent = finalDL;
            setProgress(Math.min((finalDL / 100) * 100, 100), false);

            // Dynamically set 4G / 5G based on Speed & Connection API
            let dlVal = parseFloat(finalDL);
            if (dlVal >= 40 && ping <= 20) {
              networkTag.textContent = "5G ULTRA FAST 🚀";
              networkTag.style.color = "#00f2fe";
              tierDisplay.textContent = "5G";
            } else {
              networkTag.textContent = "4G LTE 📡";
              networkTag.style.color = "#38bdf8";
              tierDisplay.textContent = "4G LTE";
            }

            // Activate Service Badges
            if (dlVal >= 5) document.getElementById('iconWeb').classList.add('active');
            if (dlVal >= 15 && ping <= 35) document.getElementById('iconGame').classList.add('active');
            if (dlVal >= 10) document.getElementById('iconVideo').classList.add('active');
            if (ping <= 50) document.getElementById('iconCall').classList.add('active');

            btn.disabled = false;
            btn.style.opacity = "1";
            btn.textContent = "TEST AGAIN";
          });
        }, 500);
      });
    }

    function runAnimation(targetSpeed, isUpload, onComplete) {
      let duration = 1800;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = timestamp - startTime;
        let percentage = Math.min(progress / duration, 1);
        
        let currentSpeed = (targetSpeed * percentage).toFixed(1);
        document.getElementById('speedDisplay').textContent = currentSpeed;
        
        let gaugePercent = Math.min((currentSpeed / 100) * 100, 100);
        setProgress(gaugePercent, isUpload);

        if (progress < duration) {
          requestAnimationFrame(animate);
        } else {
          onComplete(currentSpeed);
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
