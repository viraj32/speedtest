<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEEDTEST - Custom Dashboard</title>
    
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --subtext-color: #a0a5b5;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1d20;
            --accent-color: #0066ff;
            --subtext-color: #606470;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 420px; /* Mobile Friendly, Centered on PC */
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-theme, .btn-auth {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-auth {
            background: var(--accent-color);
            color: #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-title {
            font-size: 11px;
            color: var(--subtext-color);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            margin-top: 4px;
            color: var(--accent-color);
        }

        /* Speed Circle Gauge */
        .gauge-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            border: 6px solid var(--border-color);
            border-top: 6px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-speed {
            font-size: 40px;
            font-weight: bold;
        }

        .gauge-unit {
            font-size: 12px;
            color: var(--subtext-color);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Header Controls -->
    <div class="header">
        <h2>SPEEDTEST</h2>
        <div class="controls">
            <button class="btn-theme" id="themeToggle">☀️ Light</button>
            <button class="btn-auth" id="authBtn">SIGN IN</button>
        </div>
    </div>

    <!-- Download & Upload Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">↓ DOWNLOAD</div>
            <div class="stat-value" id="downloadVal">32.0 <small style="font-size:10px">Mbps</small></div>
        </div>
        <div class="stat-card">
            <div class="stat-title">↑ UPLOAD</div>
            <div class="stat-value" id="uploadVal">11.1 <small style="font-size:10px">Mbps</small></div>
        </div>
    </div>

    <!-- Center Gauge -->
    <div class="gauge-container">
        <div style="font-size: 10px; color: var(--subtext-color);">TEST COMPLETE</div>
        <div class="gauge-speed" id="mainSpeed">32.0</div>
        <div class="gauge-unit">MBPS</div>
    </div>

    <!-- Extra Info Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">PING</div>
            <div class="stat-value" style="font-size:15px;" id="pingVal">15 ms</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">NETWORK</div>
            <div class="stat-value" style="font-size:15px;">4G LTE</div>
        </div>
    </div>

    <button class="btn-action">TEST AGAIN</button>
</div>

<script>
    // 1. Firebase Config Setup
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "speedtest-app-e7c4f.firebaseapp.com",
        projectId: "speedtest-app-e7c4f",
        storageBucket: "speedtest-app-e7c4f.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // DOM Elements
    const authBtn = document.getElementById('authBtn');
    const themeBtn = document.getElementById('themeToggle');

    // 2. Google Authentication Logic
    authBtn.addEventListener('click', () => {
        if (auth.currentUser) {
            auth.signOut();
        } else {
            auth.signInWithPopup(provider);
        }
    });

    auth.onAuthStateChanged((user) => {
        if (user) {
            authBtn.textContent = user.displayName.split(' ')[0].toUpperCase();
        } else {
            authBtn.textContent = 'SIGN IN';
        }
    });

    // 3. Dark/Light Mode Switcher Logic
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeBtn(savedTheme);

    themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeBtn(newTheme);
    });

    function updateThemeBtn(theme) {
        themeBtn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
</script>

</body>
</html>
