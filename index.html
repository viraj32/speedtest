<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPEEDTEST - Custom Dashboard</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase Compatibility SDKs (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    .auth-btn {
      background: transparent;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-btn:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .main-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .results-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
      margin-bottom: 12px;
    }

    .res-box {
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 12px;
      padding: 12px;
      position: relative;
    }

    .res-label {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .res-value {
      font-size: 26px;
      font-weight: 800;
      margin-top: 4px;
      color: #38bdf8;
    }

    .res-value.upload { color: #c084fc; }

    .res-unit {
      font-size: 10px;
      color: #64748b;
      position: absolute;
      right: 12px;
      bottom: 12px;
    }

    .services-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .app-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #475569;
      font-size: 10px;
      font-weight: 700;
      transition: color 0.3s;
    }

    .app-icon-item i { font-size: 16px; }

    .app-icon-item.active {
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .gauge-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 10;
    }

    .gauge-progress {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 10;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
    }

    .gauge-content {
      position: absolute;
      text-align: center;
    }

    .gauge-status {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .speed-number {
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .speed-unit {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      margin-top: 4px;
    }

    .network-tag {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
    }

    .info-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .info-card {
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .info-title {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
    }

    .info-val {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
    }

    .provider-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141b2d;
      border: 1px solid #1e2d4a;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 15px;
    }

    .provider-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .provider-icon {
      width: 32px;
      height: 32px;
      background: #0b0e14;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #38bdf8;
    }

    .provider-info h4 {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }

    .provider-info p {
      font-size: 10px;
      color: #64748b;
    }

    .go-btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 28px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .go-btn:active { background: #0369a1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">SPEEDTEST</div>
    <button class="auth-btn" id="authBtn">SIGN IN</button>
  </header>

  <div class="main-container">

    <div class="results-grid">
      <div class="res-box">
        <div class="res-label"><i class="fa-solid fa-arrow-down"></i> Download</div>
        <div class="res-value" id="dlDisplay">32.0</div>
        <div class="res-unit">Mbps</div>
      </div>
      <div class="res-box">
        <div class="res-label"><i class="fa-solid fa-arrow-up"></i> Upload</div>
        <div class="res-value upload" id="ulDisplay">11.1</div>
        <div class="res-unit">Mbps</div>
      </div>
    </div>

    <div class="services-bar">
      <div class="app-icon-item active" id="iconWeb">
        <i class="fa-solid fa-globe"></i>
        <span>WEB</span>
      </div>
      <div class="app-icon-item active" id="iconGame">
        <i class="fa-solid fa-gamepad"></i>
        <span>GAMING</span>
      </div>
      <div class="app-icon-item active" id="iconVideo">
        <i class="fa-solid fa-play"></i>
        <span>VIDEO</span>
      </div>
      <div class="app-icon-item active" id="iconCall">
        <i class="fa-solid fa-user-group"></i>
        <span>CALL</span>
      </div>
    </div>

    <div class="gauge-wrapper">
      <svg class="gauge-svg" viewBox="0 0 220 220">
        <circle class="gauge-bg" cx="110" cy="110" r="100"></circle>
        <circle class="gauge-progress" id="progressCircle" cx="110" cy="110" r="100"></circle>
      </svg>
      <div class="gauge-content">
        <div class="gauge-status" id="gaugeStatus">TEST COMPLETE</div>
        <div class="speed-number" id="speedDisplay">32.0</div>
        <div class="speed-unit">MBPS</div>
        <div class="network-tag" id="networkTag">4G LTE 📡</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-title">PING</div>
        <div class="info-val" id="pingVal">15 ms</div>
      </div>
      <div class="info-card">
        <div class="info-title">NETWORK TIER</div>
        <div class="info-val" id="tierVal">4G LTE</div>
      </div>
    </div>

    <div class="provider-container">
      <div class="provider-box">
        <div class="provider-icon"><i class="fa-solid fa-sim-card"></i></div>
        <div class="provider-info">
          <h4>Airtel</h4>
          <p>iPhone 12 Pro</p>
        </div>
      </div>

      <i class="fa-solid fa-arrow-right-arrow-left" style="color: #475569; font-size: 12px;"></i>

      <div class="provider-box">
        <div class="provider-icon"><i class="fa-solid fa-server"></i></div>
        <div class="provider-info">
          <h4>Dialog Axiata</h4>
          <p>Colombo</p>
        </div>
      </div>
    </div>

    <button class="go-btn" id="startBtn" onclick="startTest()">TEST AGAIN</button>
  </div>

  <script>
    // --- EXACT FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyBcranrELwrcis3s933kNo_UORe5ssIn2o",
      authDomain: "speedtest-app-e7c4f.firebaseapp.com",
      projectId: "speedtest-app-e7c4f",
      storageBucket: "speedtest-app-e7c4f.firebasestorage.app",
      messagingSenderId: "626295808027",
      appId: "1:626295808027:web:c17e00f26a4850648ad8be",
      measurementId: "G-3MM21KGYWL"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // Sign In / Sign Out Authentication Setup
    document.addEventListener("DOMContentLoaded", () => {
      const authBtn = document.getElementById('authBtn');

      if (authBtn) {
        authBtn.addEventListener('click', () => {
          if (auth.currentUser) {
            auth.signOut().then(() => {
              authBtn.textContent = "SIGN IN";
              alert("Signed out successfully!");
            }).catch((error) => {
              console.error("Sign-out Error:", error);
            });
          } else {
            auth.signInWithPopup(provider)
              .then((result) => {
                const user = result.user;
                const firstName = user.displayName ? user.displayName.split(' ')[0].toUpperCase() : 'USER';
                authBtn.textContent = firstName;
              })
              .catch((error) => {
                console.error("Auth Error:", error);
                alert("Sign in error: " + error.message);
              });
          }
        });
      }

      // Preserve logged in state across refresh
      auth.onAuthStateChanged((user) => {
        if (user && authBtn) {
          const firstName = user.displayName ? user.displayName.split(' ')[0].toUpperCase() : 'USER';
          authBtn.textContent = firstName;
        } else if (authBtn) {
          authBtn.textContent = "SIGN IN";
        }
      });
    });

    // --- DASHBOARD GAUGE LOGIC ---
    const circle = document.getElementById('progressCircle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    // Default Gauge position for 32 Mbps
    const initialOffset = circumference - (32 / 100) * circumference;
    circle.style.strokeDashoffset = initialOffset;

    function checkNetworkType() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const netTag = document.getElementById('networkTag');
      const tierVal = document.getElementById('tierVal');

      if (conn && conn.effectiveType) {
        let type = conn.effectiveType.toUpperCase();
        if (type === '4G') {
          netTag.textContent = '4G LTE 📡';
          netTag.style.color = '#38bdf8';
          tierVal.textContent = '4G LTE';
        } else if (type === '5G') {
          netTag.textContent = '5G ULTRA 🚀';
          netTag.style.color = '#00f2fe';
          tierVal.textContent = '5G';
        } else {
          netTag.textContent = type;
          tierVal.textContent = type;
        }
      } else {
        netTag.textContent = '4G LTE 📡';
        tierVal.textContent = '4G LTE';
      }
    }

    checkNetworkType();

    function setProgress(percent, isUpload = false) {
      const offset = circumference - (percent / 100) * circumference;
      circle.style.strokeDashoffset = offset;
      circle.style.stroke = isUpload ? "#c084fc" : "#38bdf8";
    }

    function startTest() {
      const btn = document.getElementById('startBtn');
      const status = document.getElementById('gaugeStatus');
      const netTag = document.getElementById('networkTag');
      const tierVal = document.getElementById('tierVal');

      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.textContent = "TESTING...";

      document.querySelectorAll('.app-icon-item').forEach(el => el.classList.remove('active'));

      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      let ping = conn && conn.rtt ? conn.rtt : Math.floor(Math.random() * 10) + 12;
      document.getElementById('pingVal').textContent = ping + " ms";

      let targetDL = (Math.random() * 50 + 25).toFixed(1);
      let targetUL = (targetDL * 0.35).toFixed(1);

      status.textContent = "TESTING DOWNLOAD";
      runAnimation(targetDL, false, (finalDL) => {
        document.getElementById('dlDisplay').textContent = finalDL;

        setTimeout(() => {
          status.textContent = "TESTING UPLOAD";
          runAnimation(targetUL, true, (finalUL) => {
            document.getElementById('ulDisplay').textContent = finalUL;

            status.textContent = "TEST COMPLETE";
            document.getElementById('speedDisplay').textContent = finalDL;
            setProgress(Math.min((finalDL / 100) * 100, 100), false);

            if (parseFloat(finalDL) > 50) {
              netTag.textContent = '5G ULTRA 🚀';
              netTag.style.color = '#00f2fe';
              tierVal.textContent = '5G';
            } else {
              netTag.textContent = '4G LTE 📡';
              netTag.style.color = '#38bdf8';
              tierVal.textContent = '4G LTE';
            }

            if (parseFloat(finalDL) >= 10) document.getElementById('iconWeb').classList.add('active');
            if (parseFloat(finalDL) >= 20 && ping <= 35) document.getElementById('iconGame').classList.add('active');
            if (parseFloat(finalDL) >= 15) document.getElementById('iconVideo').classList.add('active');
            if (ping <= 45) document.getElementById('iconCall').classList.add('active');

            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = "TEST AGAIN";
          });
        }, 400);
      });
    }

    function runAnimation(targetSpeed, isUpload, onComplete) {
      let duration = 1600;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = timestamp - startTime;
        let percentage = Math.min(progress / duration, 1);
        
        let currentSpeed = (targetSpeed * percentage).toFixed(1);
        document.getElementById('speedDisplay').textContent = currentSpeed;
        
        let gaugePercent = Math.min((currentSpeed / 100) * 100, 100);
        setProgress(gaugePercent, isUpload);

        if (progress < duration) {
          requestAnimationFrame(animate);
        } else {
          onComplete(currentSpeed);
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
